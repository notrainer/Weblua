name: Build and publish image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Build image
        run: docker build --tag weblua:check .
      - name: Check container health and routes
        run: |
          WEBLUA_IMAGE=weblua:check docker compose up -d --pull never --wait --wait-timeout 60
          for route in / /playground /embed; do
            status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "http://127.0.0.1:8085${route}")
            test "$status" = 200
          done
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs

  publish:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@v4.4.0
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/notrainer/weblua:latest
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
